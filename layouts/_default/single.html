{{ define "main" }}
<article>
  <h1>{{ .Title }}</h1>
  <p class="post-meta">
    <time datetime="{{ .Date.Format "2006-01-02" }}">公開：{{ .Date.Format "2006年1月2日" }}</time>
    {{ if ne .Lastmod .Date }}<time datetime="{{ .Lastmod.Format "2006-01-02" }}">／更新：{{ .Lastmod.Format "2006年1月2日" }}</time>{{ end }}
  </p>
  {{ if .Params.pr }}<p class="pr-note">※本記事にはアフィリエイトリンク（PR）が含まれます。</p>{{ end }}
  {{ .Content }}
</article>
{{ end }}
